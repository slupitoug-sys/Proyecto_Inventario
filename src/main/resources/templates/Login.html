<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión - Stock Core</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
            --navbar-bg: #1e293b;
            --card-shadow: rgba(0,0,0,0.06);
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --navbar-bg: #090d16;
            --card-shadow: rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .btn-theme {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 4px var(--card-shadow);
        }
        .btn-theme:hover { opacity: 0.9; }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px var(--card-shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .brand-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .login-card h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .login-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .login-footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="btn-theme" id="themeToggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">📦</div>
            <h1>Stock Core</h1>
            <p>Ingresa tus credenciales para continuar</p>

            <form th:action="@{/ingresar}" method="post">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ej. admin_bodega" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">INGRESAR</button>
            </form>

            <div class="login-footer">
                Módulo de acceso seguro • Stock Core v1.0
            </div>
        </div>
    </div>

    <script>
        // Cargar tema guardado al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('themeToggle');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                if (btn) btn.textContent = '☀️ Modo Claro';
            } else {
                if (btn) btn.textContent = '🌙 Modo Oscuro';
            }
        });

        // Alternar tema y guardar en memoria
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                if (btn) btn.textContent = '☀️ Modo Claro';
                localStorage.setItem('theme', 'dark');
            } else {
                if (btn) btn.textContent = '🌙 Modo Oscuro';
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
