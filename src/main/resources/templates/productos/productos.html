<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CoreStock - Gestión de Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="#">CoreStock <span class="text-warning fs-6">| Módulo de Inventarios</span></a>
        <span class="text-white-50">Panel de Control</span>
    </nav>

    <div class="container mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-secondary fw-bold">Catálogo de Productos</h4>
                <span class="badge bg-primary">Estado: Conectado a MySQL</span>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Unidad de Medida</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Iterando con Thymeleaf la lista de la BD -->
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.idProducto}">1</td>
                            <td th:text="${p.codigo}">P001</td>
                            <td th:text="${p.nombre}">Producto Ejemplo</td>
                            <td th:text="${p.unidadMedida}">Unidad</td>
                            <td>
                                <span th:if="${p.estado}" class="badge bg-success">Activo</span>
                                <span th:unless="${p.estado}" class="badge bg-danger">Inactivo</span>
                            </td>
                        </tr>
                        <!-- Mensaje por si la tabla está vacía -->
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay productos registrados en la base de datos todavía.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
