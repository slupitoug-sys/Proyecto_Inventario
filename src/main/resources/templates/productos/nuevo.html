<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - Stock Core</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">
        Stock Core
    </a>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Registrar Producto</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/productos/guardar}"
                  th:object="${producto}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{codigo}">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('codigo')}"
                         th:errors="*{codigo}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('nombre')}"
                         th:errors="*{nombre}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{descripcion}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Unidad de medida</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{unidadMedida}">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('unidadMedida')}"
                         th:errors="*{unidadMedida}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>

                    <select class="form-select"
                            th:field="*{estado}">
                        <option value="">Seleccione un estado</option>
                        <option value="true">Activo</option>
                        <option value="false">Inactivo</option>
                    </select>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('estado')}"
                         th:errors="*{estado}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar Producto
                </button>

                <a href="/productos" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
